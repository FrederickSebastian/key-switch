[package]
name = "key-switch-tui"
version = "1.1.0"
edition = "2021"

[dependencies]
key-switch-core = { path = "../key-switch-core" }
ratatui = "0.29"
crossterm = "0.28"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde_json = "1"
zeroize = "1"
unicode-width = "0.2"
